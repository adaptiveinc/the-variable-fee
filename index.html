<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Variable Fee</title>
<style>
  :root{
    --ink:#0e141c; --panel:#161e29; --panel2:#1c2634; --line:#28344455;
    --text:#e7ecf3; --muted:#8b98aa; --faint:#5d6b7e;
    --gold:#d9a648; --gold-dim:#d9a64822; --cyan:#72b7cc; --green:#63b380;
    --red:#e06a5e; --red-dim:#e06a5e1c; --green-dim:#63b3801f;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--ink)}
  body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100vh}
  ::selection{background:var(--gold);color:#10151c}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

  /* ---------------- HUD ---------------- */
  #hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 200px 12px 18px;
    border-bottom:1px solid var(--line);background:#0e141cf5;position:sticky;top:0;z-index:40}
  #hud .brand{font-family:var(--serif);font-size:17px;white-space:nowrap}
  #hud .brand em{font-style:italic;color:var(--gold)}
  #hud .where{font-family:var(--mono);font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--faint)}
  .dirbtn{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--cyan);border:1px solid #72b7cc44;border-radius:6px;padding:3px 10px;transition:background .15s}
  .dirbtn:hover{background:#72b7cc1a}
  #ledgerchips{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap}
  .chip{display:flex;gap:6px;align-items:baseline;font-size:11px;color:var(--faint)}
  .chip b{font-family:var(--mono);font-size:12.5px;color:var(--text);font-variant-numeric:tabular-nums}
  .chip.hot b{color:var(--gold)} .chip.neg b{color:var(--red)}
  .chip.flash{animation:chipflash .8s ease}
  @keyframes chipflash{0%{background:var(--gold-dim)}100%{background:transparent}}
  #audit{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);position:absolute;top:16px;right:18px}
  #audit .bar{width:80px;height:5px;border-radius:3px;background:#232e3d;overflow:hidden}
  #audit .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e8c273);transition:width .5s}
  #audit b{font-family:var(--mono);color:var(--text)}
  #audit{cursor:pointer}
  .books-callout{position:absolute;top:calc(100% + 10px);right:14px;z-index:80;width:300px;background:var(--gold);color:#131a24;
    font-size:13px;line-height:1.45;padding:11px 15px;border-radius:10px;box-shadow:0 6px 24px #00000060;
    cursor:pointer;animation:calloutIn .4s ease, calloutBob 2.2s ease-in-out .4s infinite}
  .books-callout::before{content:'';position:absolute;top:-8px;right:44px;border:8px solid transparent;border-top:none;border-bottom-color:var(--gold)}
  .books-callout b{display:block;margin-bottom:2px;padding-right:16px}
  .books-callout{cursor:pointer}
  .books-callout .bc-x{position:absolute;top:3px;right:7px;font-size:16px;line-height:1;color:inherit;opacity:.65;background:none;border:none;cursor:pointer;padding:2px}
  .books-callout .bc-x:hover{opacity:1}
  [data-theme="light"] .books-callout{color:#ffffff}
  @keyframes calloutIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @keyframes calloutBob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
  @media(prefers-reduced-motion:reduce){.books-callout{animation:calloutIn .4s ease}}
  .chip{cursor:pointer;border-radius:5px;padding:1px 5px;margin:-1px -5px}
  .chip:hover{background:#ffffff0d}
  .finding{border-top:1px solid var(--line);padding:9px 0 7px}
  .fhead{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin-bottom:3px}
  .fq{font-size:13.5px;color:#d5dde8}
  .fa{font-size:12.5px;color:#e8907f;margin-top:2px}
  .fl{font-size:12.5px;color:var(--green);margin-top:5px;font-weight:600}
  .fy{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
  .roll{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
  .roll th{text-align:left;color:var(--faint);font-weight:600;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line)}
  .roll td{padding:5px 6px;border-bottom:1px solid #28344433;color:#c9d3df;vertical-align:top}
  .roll .tn{color:var(--faint);font-family:var(--mono);font-size:10.5px}
  .roll .td{font-family:var(--mono);text-align:right;white-space:nowrap}
  .roll .td.pos{color:var(--green)} .roll .td.neg{color:var(--red)}
  .roll .tb{font-family:var(--mono);text-align:right;color:var(--text)}
  .troom{color:var(--faint);font-size:11px}

  .chip:focus-visible,#audit:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:5px}
  /* the quiz button flashes while the capstone file is the pending next step */
  #quizBtn.urge{animation:nextflash 1.2s ease-in-out infinite;border-color:#d9a64888}
  @media(prefers-reduced-motion:reduce){#quizBtn.urge{animation:none;background:var(--gold-dim)}}
  /* ---------------- stage ---------------- */
  #stage{max-width:1150px;margin:0 auto;padding:14px 14px 60px}
  .fadein{animation:fade .5s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @media(prefers-reduced-motion:reduce){.fadein{animation:none}}

  /* ---------------- hero ---------------- */
  .hero{padding:64px 10px 30px;max-width:660px}
  .hero .kicker{font-family:var(--mono);font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
  .hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(36px,6vw,56px);line-height:1.08;margin:14px 0 16px;text-wrap:balance}
  .hero h1 em{font-style:italic;color:var(--gold)}
  .hero p{color:var(--muted);font-size:16px;max-width:54ch}
  .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
  .cta{border:1px solid #d9a64866;color:var(--gold);border-radius:7px;padding:9px 20px;font-size:14px;transition:background .15s}
  .cta:hover{background:var(--gold-dim)}
  .cta.big{background:var(--gold);color:#131a24;border:none;font-weight:600;font-size:15px;padding:12px 26px}
  .cta.big:hover{background:#e5b95f}
  .cta.ghost{border-color:var(--line);color:var(--muted)}

  /* ---------------- scene ---------------- */
  .scene{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0c1118}
  .scene svg{display:block;width:100%;height:auto}
  /* scenes mount inside .scenewrap; on small portrait screens it becomes a swipeable viewport */
  .scenewrap{overflow:hidden}
  @media(max-width:740px) and (orientation:portrait){
    .scenewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .scenewrap::-webkit-scrollbar{display:none}
    .scenewrap svg{height:62vh;width:auto;max-width:none}
  }
  .scene-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;pointer-events:none}
  .scene-top>*{pointer-events:auto}
  .backbtn{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:5px 12px;background:#0e141cd9}
  .backbtn:hover{color:var(--text);border-color:var(--faint)}
  .objective{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--muted);
    background:#0e141cd9;border:1px solid var(--line);border-radius:6px;padding:6px 11px;text-align:right}
  .objective b{color:var(--gold)}

  /* dialogue bar */
  .dlg{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:12px;align-items:flex-start;
    background:#10161ff0;border:1px solid #2c394a;border-radius:12px;padding:13px 16px;backdrop-filter:blur(4px);
    animation:dlgup .35s ease}
  @keyframes dlgup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .dlg .pv{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    font-family:var(--mono);font-size:12px;font-weight:700}
  .pv.ph{background:#173340;color:var(--cyan);border:1px solid #72b7cc44}
  .pv.act{background:#33290f;color:var(--gold);border:1px solid #d9a64844}
  .pv.aud{background:#3a1f1c;color:var(--red);border:1px solid #e06a5e44}
  .pv.sys{background:#1d2734;color:var(--muted);border:1px solid var(--line)}
  .pv.uw{background:#232e3d;color:#aeb9c9;border:1px solid #8b98aa44}
  .pv.you{background:#33290f;color:var(--gold);border:1px solid #d9a64866}
  .memo{font-size:13px;color:var(--muted);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:9px 13px;margin:2px 0 4px;line-height:1.6}
  .memo b{color:var(--text);font-family:var(--mono);font-weight:600}
  .dlg .txt{flex:1;min-width:0}
  .dlg .who{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:3px}
  .dlg p{color:#d5dde8;font-size:14.5px}
  .dlg .num{font-family:var(--mono);color:var(--gold)}
  .dlg .next{flex:none;align-self:flex-end;border:1px solid #d9a64866;color:var(--gold);border-radius:6px;padding:6px 14px;font-size:12.5px;
    animation:nextflash 1.2s ease-in-out infinite}
  .dlg .next:hover{background:var(--gold-dim);animation:none}
  @keyframes nextflash{0%,100%{background:transparent;box-shadow:none}50%{background:var(--gold-dim);box-shadow:0 0 0 3px #d9a64833}}
  @media(prefers-reduced-motion:reduce){.dlg .next{animation:none;background:var(--gold-dim)}}
  /* while a conversation is open, the door button steps aside and the hotspots stop
     pulsing: the flashing thing on screen is the Next button */
  .scene:has(.dlg) > .cta.big{opacity:0;pointer-events:none}
  .scene > .cta.big{transition:opacity .25s}
  .scene:has(.dlg) .hs .pulse{display:none}
  .scene:has(.dlg) .hs.next .ring,.scene:has(.dlg) .hs.next .halo{animation:none}
  .scene:has(.dlg) .hs.next .halo{opacity:0}

  /* hotspots inside svg */
  .hs{cursor:pointer}
  .hs .ring{fill:#0e141c;stroke:var(--gold);stroke-width:1.5;opacity:.92}
  .hs text{fill:var(--gold);font-family:var(--mono);font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:central}
  .hs.q .ring{stroke:var(--cyan)} .hs.q text{fill:var(--cyan)}
  .hs .pulse{fill:none;stroke:var(--gold);opacity:.7;animation:pulse 2s ease-out infinite}
  .hs.q .pulse{stroke:var(--cyan)}
  @keyframes pulse{from{transform:scale(.6);opacity:.8}to{transform:scale(1.9);opacity:0}}
  .hs.done .ring{stroke:var(--green)} .hs.done text{fill:var(--green)}
  .hs.done .pulse{display:none}
  .hs .cap{font-size:10.5px;letter-spacing:1.6px;font-weight:600;paint-order:stroke;stroke:#0e141c;stroke-width:3px}
  .hs .tick{display:none}
  .hs.done .glyph{display:none}
  .hs.done .tick{display:block}
  .hs .halo{fill:var(--gold);opacity:0;transform-box:fill-box;transform-origin:center}
  .hs .evcard text{fill:var(--text);font-family:var(--sans);font-size:14px;font-weight:400;letter-spacing:0;text-anchor:middle;dominant-baseline:auto}
  .hs .evcard text.hdr{fill:var(--gold);font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px}
  .hs.q .halo{fill:var(--cyan)}
  .hs.next .halo{animation:halo 1.1s ease-in-out infinite}
  @keyframes halo{0%,100%{opacity:.14;transform:scale(1)}50%{opacity:.5;transform:scale(1.6)}}
  .hs.next .pulse{animation-duration:1.1s}
  .hs.next .ring{animation:hsFlash 1.1s ease-in-out infinite}
  @keyframes hsFlash{0%,100%{stroke-width:2}50%{stroke-width:5.5}}
  .hs.next .cap{font-size:11.5px}
  @media(prefers-reduced-motion:reduce){.hs.next .ring,.hs.next .halo{animation:none}.hs.next .halo{opacity:.3}}
  @media(prefers-reduced-motion:reduce){.hs .pulse{animation:none;display:none}}
  .hs.hidden{display:none}

  /* figure rig, characters are alive: idle bob + blink + arm sway; richer states via data-state */
  .fig .body,.fig .eyes,.fig .head,.fig .arm-l,.fig .arm-r,.fig .leg-l,.fig .leg-r{transform-box:fill-box}
  .fig .body{transform-origin:50% 100%;animation:figBob 3.4s ease-in-out infinite}
  .fig .eyes{transform-origin:50% 50%;animation:figBlink 4.6s linear infinite}
  .fig .head{transform-origin:50% 88%}
  .fig .arm-l,.fig .arm-r{transform-origin:50% 6%}
  .fig .leg-l,.fig .leg-r{transform-origin:50% 4%}
  .fig .arm-l{animation:figSwayL 3.4s ease-in-out infinite}
  .fig .arm-r{animation:figSwayR 3.4s ease-in-out infinite}
  .fig[data-state="talk"] .head{animation:figNod 1.2s ease-in-out infinite}
  .fig[data-state="talk"] .arm-r{animation:figGesture 1.2s ease-in-out infinite}
  .fig[data-state="walk"] .leg-l{animation:figStepL .5s ease-in-out infinite}
  .fig[data-state="walk"] .leg-r{animation:figStepR .5s ease-in-out infinite}
  .fig[data-state="walk"] .arm-l{animation:figStepR .5s ease-in-out infinite}
  .fig[data-state="walk"] .arm-r{animation:figStepL .5s ease-in-out infinite}
  .fig[data-state="walk"] .body{animation:figJog .25s ease-in-out infinite}
  .fig[data-state="wave"] .arm-r{animation:figWave .7s ease-in-out infinite}
  .fig[data-state="celebrate"] .arm-l{animation:figCheerL .5s ease-in-out infinite}
  .fig[data-state="celebrate"] .arm-r{animation:figCheerR .5s ease-in-out infinite}
  .fig[data-state="celebrate"] .body{animation:figHop .5s ease-in-out infinite}
  @keyframes figBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
  @keyframes figBlink{0%,93.9%,98.1%,100%{transform:scaleY(1)}94.6%,97.4%{transform:scaleY(.1)}}
  @keyframes figSwayL{0%,100%{transform:rotate(2.5deg)}50%{transform:rotate(-2.5deg)}}
  @keyframes figSwayR{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
  @keyframes figNod{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(2.5deg)}}
  @keyframes figGesture{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}
  @keyframes figStepL{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}}
  @keyframes figStepR{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
  @keyframes figJog{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
  @keyframes figWave{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-178deg)}}
  @keyframes figCheerL{0%,100%{transform:rotate(160deg)}50%{transform:rotate(178deg)}}
  @keyframes figCheerR{0%,100%{transform:rotate(-160deg)}50%{transform:rotate(-178deg)}}
  .thought{animation:thoughtFloat 3.2s ease-in-out infinite;transition:opacity .25s}
  @keyframes thoughtFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .fig[data-state="walk"]+.thought{opacity:0}
  @media(prefers-reduced-motion:reduce){.thought{animation:none}}

  @media(prefers-reduced-motion:reduce){.fig .body,.fig .eyes,.fig .head,.fig .arm-l,.fig .arm-r,.fig .leg-l,.fig .leg-r{animation:none!important}}


  /* map effects */
  .room-g{cursor:pointer}
  .room-g.locked{cursor:not-allowed;opacity:.55}
  .room-g .glowrect{opacity:0;transition:opacity .3s}
  .room-g:not(.locked):hover .glowrect{opacity:1}
  /* the room to walk into next flashes its outline — unmissable among the dim ones */
  .room-g.next .glowrect{animation:roomflash 1.2s ease-in-out infinite}
  @keyframes roomflash{0%,100%{opacity:.15;stroke-width:2}50%{opacity:1;stroke-width:6}}
  @media(prefers-reduced-motion:reduce){.room-g.next .glowrect{animation:none;opacity:1;stroke-width:4}}
  .doorglow{animation:doorglow 1.8s ease-in-out infinite}
  @keyframes doorglow{0%,100%{opacity:.25}50%{opacity:.85}}
  .lamp-red{animation:alarmpulse 1.1s ease-in-out infinite}
  @keyframes alarmpulse{0%,100%{opacity:.25}50%{opacity:.95}}
  .rain line{stroke:#7fa0c0;stroke-width:1.2;opacity:.5}
  .rain{animation:rainfall .7s linear infinite}
  @keyframes rainfall{from{transform:translateY(-30px)}to{transform:translateY(30px)}}
  @media(prefers-reduced-motion:reduce){.rain,.doorglow,.lamp-red{animation:none}}
  .ticker-tape{animation:tick 14s linear infinite}
  @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-600px)}}
  .drawline{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2.2s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media(prefers-reduced-motion:reduce){.drawline{animation:none;stroke-dashoffset:0}.ticker-tape{animation:none}}
  .wf-bar{transition:height .8s ease, y .8s ease, opacity .5s}

  .room-g:focus{outline:none}
  .room-g:focus-visible .glowrect{opacity:1}
  /* ---------------- modal ---------------- */
  #modal-root{position:fixed;inset:0;z-index:60;display:none}
  #modal-root.open{display:block}
  .mback{position:absolute;inset:0;background:#05080cd0;backdrop-filter:blur(3px)}
  .mwrap{position:absolute;inset:0;overflow-y:auto;display:grid;place-items:start center;padding:6vh 16px 60px;pointer-events:none}
  .mcard{pointer-events:auto;width:min(640px,100%);background:linear-gradient(#1a2230,#161e29);
    border:1px solid #d9a64840;border-radius:14px;padding:22px 24px;animation:mup .3s ease}
  @keyframes mup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .mcard .qk{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:9px}
  .mcard h4{font-family:var(--serif);font-weight:500;font-size:20px;margin-bottom:10px}
  .mcard .q{font-size:15.5px;margin-bottom:14px}
  .mcard p{color:#c9d3df;font-size:14px}
  .mcard p+p{margin-top:8px}
  .mcard .num{font-family:var(--mono);color:var(--gold)}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--panel2);
    padding:10px 13px;font-size:13.5px;color:#cdd6e2;display:flex;gap:10px;align-items:flex-start;transition:border-color .15s,background .15s}
  .opt .key{font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-top:1px;flex:none}
  .opt:not(:disabled):hover{border-color:#d9a64866;background:#202b3a}
  .opt.right{border-color:#63b38088;background:var(--green-dim);color:var(--text)}
  .opt.right .key{border-color:#63b38088;color:var(--green)}
  .opt.wrong{border-color:#e06a5e77;background:var(--red-dim);animation:shake .3s}
  .opt:disabled{cursor:default;opacity:.5}
  .opt.right:disabled,.opt.wrong:disabled{opacity:1}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .verdict{margin-top:12px;font-size:13.5px;line-height:1.55;border-radius:8px;padding:10px 13px}
  .verdict.good{background:var(--green-dim);border:1px solid #63b38044;color:#cfe6d6}
  .verdict.bad{background:var(--red-dim);border:1px solid #e06a5e3d;color:#eccfc9}
  .cite{display:inline-block;font-family:var(--mono);font-size:10.5px;border:1px solid #d9a64855;color:var(--gold);border-radius:4px;padding:1px 7px;margin:6px 6px 0 0;cursor:help}
  .cite:hover{background:var(--gold-dim)}
  .cite-pop{position:fixed;z-index:200;max-width:320px;background:var(--gold);color:#131a24;border-radius:8px;
    padding:9px 13px;font-size:12.5px;line-height:1.5;box-shadow:0 8px 24px #00000066;animation:mup .2s ease}
  [data-theme="light"] .cite-pop{color:#ffffff}
  .mfoot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:16px}
  .file-list{list-style:none;margin:10px 0 4px;display:flex;flex-direction:column;gap:6px}
  .file-list li{font-size:13.5px;color:#c3cddb;padding-left:16px;position:relative}
  .file-list li::before{content:"·";position:absolute;left:2px;color:var(--gold)}
  .mclose{position:absolute;top:10px;right:14px;color:var(--faint);font-size:20px;padding:4px 8px}
  .mclose:hover{color:var(--text)}
  .mcard-holder{position:relative;pointer-events:auto;width:min(640px,100%)}

  /* end overlay content */
  .grade{font-family:var(--serif);font-size:32px;margin:6px 0 8px}
  .rules{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

  .mcard:focus{outline:none}
  .mcard:focus-visible{outline:2px solid var(--gold, #d9a648);outline-offset:2px}
  /* ---------------- light mode ---------------- */
  [data-theme="light"]{

'use strict';
/* ================= what this game is =================
   Read by the shared chunks (progress, ledger, shell, nav, retake-flow).
   Everything here is copy or a key; the mechanics live in shared/. */
const GAME={
  key:'vfa-house-v2', /* v2: mastery is earned from zero, capstone cases added */
  themeKey:'vfa-theme',
  tipKey:'vfa-mobiletip',
  /* mastery economy: 19 room questions x 4 + 2 capstone cases x 12 = 100 */
  questionPts:4, capstonePts:12,
  where:'Learning Variable Fee Assurance in Mutual & Torres Assurance House',
  wherePrefix:'Mutual & Torres · ',
  backLabel:'← House map',
  restartCopy:'All room progress, the ledger and the audit file will reset. Your theme choice stays.',
  ledgerOpen:()=>!(L.account===0&&L.csm===0&&!S.done.studio),
  booksCallout:'<b>Your books just opened.</b>These numbers evolve with every decision you make. Click any of them to see its full roll-forward.',
  masteryCallout:'<b>This bar tracks your mastery points.</b>You earn points every time you answer a question right on the first try: 4 for a room question, 12 for a capstone case, 100 in total. If you get one wrong, you can retake it later and earn the missing points. Click the bar to see which questions you missed.',

function openModal(node,closable,onClose){
  if(MODAL_ONCLOSE){const cb=MODAL_ONCLOSE;MODAL_ONCLOSE=null;cb();}
  MODAL_ONCLOSE=onClose||null;

  if(document.activeElement&&document.activeElement!==document.body)MODAL_LASTFOCUS=document.activeElement;
  const holder=document.createElement('div');holder.className='mcard-holder';

  node.setAttribute('tabindex','-1');
  node.setAttribute('role','dialog');
  node.setAttribute('aria-modal','true');
  try{node.focus({preventScroll:true});}catch(e){}

  if(c.includes('/')){const[p,b]=c.split('/');

/* ================= roll-forward: one component's whole story =================
   Clicking a ledger chip opens every movement that built it, as a waterfall
   plus a table. Generic over the game: the host supplies COMP_NAMES (chip key
   -> full name), an optional COMP_NOTES (chip key -> explanatory line), and
   ledgerHistory(), a flat list of {room, label, d:{key:delta}} in booking order.
*/
function showComponent(k){
  const H=ledgerHistory().filter(h=>h.d&&h.d[k]!==undefined);
  const dp=(LEDGER_CHIPS.find(d=>d.k===k)||{}).dp===2?fmt2:fmt;
  const card=el('div','mcard');
  card.append(el('div','qk','Roll-forward'));
  card.append(el('h4','',(COMP_NAMES[k]||k)+' · now '+dp(L[k])));
  const note=(typeof COMP_NOTES!=='undefined'&&COMP_NOTES)?COMP_NOTES[k]:null;
  if(note)card.insertAdjacentHTML('beforeend','<p class="fy">'+note+'</p>');
  if(!H.length){card.insertAdjacentHTML('beforeend','<p>Nothing has been booked here yet. Play on and come back.</p>');}
  else{
    let bal=0;
    const steps=H.map(h=>{bal=Math.round((bal+h.d[k])*100)/100;return{label:h.label,room:h.room,delta:h.d[k],to:bal};});
    const n=steps.length, vals=[0].concat(steps.map(s=>s.to));
    const lo=Math.min(0,...vals), hi=Math.max(1,...vals);
    const Wd=520,Ht=150,pad=12;
    const y=v=>pad+(hi-v)/(hi-lo||1)*(Ht-2*pad);
    const slot=(Wd-20)/n, bw=Math.min(70,slot*0.7);
    let bars='';
    steps.forEach((s,i)=>{
      const x=10+i*slot+(slot-bw)/2;
      const a=y(s.to), b2=y(s.to-s.delta);
      const y1=Math.min(a,b2), hpx=Math.max(2,Math.abs(a-b2));
      bars+=`<rect x="${x}" y="${y1}" width="${bw}" height="${hpx}" rx="2" fill="${s.delta>=0?'#63b380':'#e06a5e'}" opacity=".85"/>`;
      bars+=`<text x="${x+bw/2}" y="${Ht+12}" text-anchor="middle" font-size="10" fill="#5d6b7e" font-family="var(--mono)">${i+1}</text>`;
      bars+=`<text x="${x+bw/2}" y="${y1-3}" text-anchor="middle" font-size="10" fill="#8b98aa" font-family="var(--mono)">${dp(s.to)}</text>`;
    });
    card.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 ${Wd} ${Ht+18}" style="width:100%;margin:6px 0"><line x1="6" x2="${Wd-6}" y1="${y(0)}" y2="${y(0)}" stroke="#2c394a"/>${bars}</svg>`);
    const rows=steps.map((s,i)=>`<tr><td class="tn">${i+1}</td><td>${s.label}<span class="troom"> · ${s.room}</span></td><td class="td ${s.delta<0?'neg':'pos'}">${s.delta>0?'+':''}${dp(s.delta)}</td><td class="tb">${dp(s.to)}</td></tr>`).join('');
    card.insertAdjacentHTML('beforeend',`<table class="roll"><tr><th></th><th>Movement</th><th>Change</th><th>Balance</th></tr>${rows}</table>`);
  }
  const f=el('div','mfoot');const b=el('button','cta','Close');b.onclick=closeModal;f.append(b);card.append(f);
  openModal(card,true);
}

function retakeList(){
  const byQ=new Map();
  for(const m of S.mistakes){
    if(!m.c||m.done)continue;
    if(!byQ.has(m.q))byQ.set(m.q,{q:m.q,k:m.k,w:m.w,c:m.c,y:m.y,x:m.x||'',p:m.p||0,wrongs:new Set()});
    if(m.a&&m.a!==m.c)byQ.get(m.q).wrongs.add(m.a);
  }
  return [...byQ.values()];
}
function retakeQuiz(r){
  const options=[{t:r.c,ok:true,why:r.y||''}];
  [...r.wrongs].slice(0,3).forEach(a=>options.push({t:a,why:'This is the answer the audit file flagged last time.'}));
  return {kicker:r.k||r.w,q:r.q,intro:r.x||'',options};
}
function examQuiz(o,idx,total,drill){
  return new Promise(res=>{
    const card=el('div','mcard');
    card.append(el('div','qk',(drill?'Numbers drill':'Retake')+' · '+idx+' of '+total+(o.kicker&&!drill?' · '+o.kicker:'')));
    if(o.intro)card.insertAdjacentHTML('beforeend',o.intro);
    card.append(el('div','q',o.q));
    const opts=el('div','opts'); const keys='ABCD';
    const shuffled=o.options.map((op,i)=>({op,r:(Math.sin(i*9301+o.q.length*49297)*233280)%1}))
      .sort((a,b)=>a.r-b.r).map(x=>x.op);
    shuffled.forEach((op,i)=>{
      const b=el('button','opt');
      b.append(el('span','key',keys[i]),el('span','',op.t));
      b.onclick=()=>{
        [...opts.children].forEach(x=>x.disabled=true);
        if(op.ok){
          b.classList.add('right');
          card.append(el('div','verdict good','<strong>Correct.</strong> '+(op.why||'')
            +(o.cite?'<div>'+o.cite.map(citeChip).join('')+'</div>':'')));
          const f=el('div','mfoot');const c=el('button','cta big',idx<total?'Next question':'Finish');
          c.onclick=()=>{closeModal();res(true);};f.append(c);card.append(f);
          c.scrollIntoView({block:'nearest'});
        }else{
          b.classList.add('wrong');
          if(drill){
            const co=o.options.find(x=>x.ok)||{};
            card.append(el('div','verdict bad','<strong>Not quite.</strong> '+(op.why||'')+' The right call: <strong>'+co.t+'</strong>. <em>Practice only, no penalty.</em>'));
            const f=el('div','mfoot');const c=el('button','cta big',idx<total?'Next question':'Finish');
            c.onclick=()=>{closeModal();res(true);};f.append(c);card.append(f);
          } else {
            card.append(el('div','verdict bad','<strong>Not this time.</strong> '+(op.why||'')+' <em>One miss ends the retake. The findings stay open; come back whenever you are ready.</em>'));
            const f=el('div','mfoot');const c=el('button','cta big','Back to the game');
            c.onclick=()=>{closeModal();res(false);};f.append(c);card.append(f);
          }
        }
      };
      opts.append(b);
    });
    card.append(opts);
    openModal(card,false);
    /* escapable: leaving ends the attempt, no penalty */
    const holder=card.parentElement;
    if(holder){
      const x=document.createElement('button');x.className='mclose';x.innerHTML='×';
      x.setAttribute('aria-label',drill?'Leave the drill':'Leave the retake');
      x.title=drill?'Leave the drill':'Leave the retake (no penalty, come back any time)';
      x.onclick=()=>{closeModal();res(false);};
      holder.append(x);
    }
  });
}
/* ================= the retake desk =================
   A miss files a finding instead of deducting. The findings come back as a
   retake: answer them all right in one sitting and the mastery they carried is
   earned back. At the end of a run the numbers drill is the mandatory last step.

   The host supplies NUMQ (the drill questions), CAPSTONES + runCapstones(), and
   GAME.drill {noun, blurb, doneCopy} for the copy around them.
*/
function finishRetake(){
  /* the cleared findings hand back the mastery they carried */
  const back=retakeList().reduce((t,r)=>t+(r.p||QUESTION_PTS),0);
  S.mistakes.forEach(m=>m.done=1);
  S.score=Math.min(100,S.score+back);
  S.retakePassed=1;S.drillDue=0;save();setAudit();
  const card=el('div','mcard');
  card.append(el('div','qk','Retake passed'));
  card.append(el('div','grade','Findings cleared.'));
  card.insertAdjacentHTML('beforeend','<p>Every missed question answered right'+(isLastDone()?' and the numbers walked through':'')+'. The mastery those findings carried is earned back: case mastery now stands at <strong>'+S.score+'/100</strong>. The findings stay in the audit file as history, marked cleared, with their explanations now open.</p>');
  const f=el('div','mfoot');const b=el('button','cta big','Continue');b.onclick=()=>{closeModal();if(isLastDone())endOverlay();};f.append(b);card.append(f);
  openModal(card,true);
}
async function runRetake(R){
  const qs=R.map(retakeQuiz);
  for(let i=0;i<qs.length;i++){
    const ok=await examQuiz(qs[i],i+1,qs.length);
    if(!ok)return;
  }
  if(!isLastDone()){finishRetake();return;}
  /* end-game: the numbers drill is the mandatory last step */
  S.drillDue=1;save();
  await new Promise(res=>{
    const card=el('div','mcard');
    card.append(el('div','qk','Findings cleared'));
    card.append(el('h4','','One step left: the numbers'));
    card.insertAdjacentHTML('beforeend','<p>'+GAME.drill.retakeIntro+'</p>');
    const f=el('div','mfoot');const b=el('button','cta big','Start the numbers drill');b.onclick=()=>{closeModal();res();};f.append(b);card.append(f);
    openModal(card,false);
  });
  await runDrill();
}
async function runDrillCore(){
  for(let i=0;i<NUMQ.length;i++){const cont=await examQuiz(NUMQ[i],i+1,NUMQ.length,true);if(!cont)return false;}
  return true;
}
async function runDrill(){
  const done=await runDrillCore();
  if(!done)return;
  if(S.drillDue){finishRetake();return;}
  const card=el('div','mcard');
  card.append(el('div','qk','Numbers drill'));
  card.append(el('h4','','Drill complete'));

  const f=el('div','mfoot');const b=el('button','cta big','Close');b.onclick=closeModal;f.append(b);card.append(f);
  openModal(card,true);
}

function quiz(o, scoring){
  /* resolves when correct + continue; a right answer on the FIRST try earns points
     (host hook `award(o.pts)`), a miss files a mistake and forfeits them */
  return new Promise(res=>{
    let missed=false;
    const card=el('div','mcard');
    card.append(el('div','qk',o.kicker||'Your call'));
    const pre=o.intro||o.ctx; /* the case memo stays on the question page, so the reader can re-check the facts */
    if(pre)card.insertAdjacentHTML('beforeend',pre);
    card.append(el('div','q',o.q));
    const opts=el('div','opts'); const keys='ABCD';
    const shuffled=o.options.map((op,i)=>({op,r:(Math.sin(i*9301+o.q.length*49297)*233280)%1}))
      .sort((a,b)=>a.r-b.r).map(x=>x.op);
    shuffled.forEach((op,i)=>{
      const b=el('button','opt');
      b.append(el('span','key',keys[i]),el('span','',op.t));
      b.onclick=()=>{
        if(op.ok){
          [...opts.children].forEach(x=>x.disabled=true);
          b.classList.add('right');
          if(scoring&&!missed&&typeof award==='function')award(o.pts);
          const v=el('div','verdict good','<strong>Correct.</strong> '+op.why
            +(o.cite?'<div>'+o.cite.map(citeChip).join('')+'</div>':''));
          card.append(v);
          const f=el('div','mfoot');const c=el('button','cta big',o.continueLabel||'Continue');
          c.onclick=()=>{closeModal();res();};f.append(c);card.append(f);
          c.scrollIntoView({block:'nearest'});
        }else{
          b.classList.add('wrong');b.disabled=true;
          /* the finding files where it happened: the scene name, without the
             house/line prefix the top bar carries in front of it */
          if(scoring){const co=o.options.find(x=>x.ok)||{};S.mistakes.push({w:document.getElementById('whereLabel').textContent.replace(GAME.wherePrefix,''),k:o.kicker||'',q:o.q,a:op.t,c:co.t||'',y:co.why||'',x:o.ctx||o.intro||'',p:o.pts||0});S.retakePassed=0;S.drillDue=0;}
          missed=true;
          penalty(scoring);
          card.append(el('div','verdict bad','<strong>The auditor flags it.</strong> '+op.why+(scoring?' <em>(No mastery earned on this one; the finding goes on file, and its points come back through the retake. Try again.)</em>':' <em>(Review replay, nothing at stake.)</em>')));
        }
      };
      opts.append(b);
    });
    card.append(opts);
    openModal(card,false);
  });
}

/* ================= dialogue ================= */
/* Six speaker slots, styled by .pv.<slot> in dialogue.css. Each game maps its
   own cast onto them: SPEAKERS ties a slot to the figure kind that animates
   while it talks, SPEAKER_TAGS is the two-or-three letter chip on the avatar. */
function talk(sceneEl,lines){
  const WHO=SPEAKERS;
  const speak=w=>{sceneEl.querySelectorAll('.fig').forEach(f=>{
    f.dataset.state=(WHO[w]&&f.dataset.who===WHO[w])?'talk':'idle';});};
  return new Promise(res=>{
    let i=0;
    const bar=el('div','dlg');
    sceneEl.append(bar);
    const show=()=>{
      const ln=lines[i];
      speak(ln.w);
      bar.innerHTML='';
      bar.append(el('div','pv '+ln.w, SPEAKER_TAGS[ln.w]||'·'));
      const t=el('div','txt');
      if(ln.n)t.append(el('div','who',ln.n));
      t.append(el('p','',ln.t));bar.append(t);
      const n=el('button','next',i<lines.length-1?'Next':'Done');
      n.onclick=()=>{i++;if(i<lines.length)show();else{bar.remove();sceneEl.querySelectorAll('.fig').forEach(f=>f.dataset.state='idle');res();}};
      bar.append(n);
      /* a click anywhere on the bar advances too — the conversation never traps anyone */
      bar.onclick=e=>{if(!e.target.closest('.next'))n.click();};
    };
    show();
  });
}

/* ================= stage / router ================= */
const stage=document.getElementById('stage');
/* rebuilding the stage always releases the hotspot lock: a handler whose scene
   was torn down mid-await (walked out during a dialogue) must not freeze the next room */
function clearStage(){stage.innerHTML='';HS_BUSY=false;}
function sceneShell(roomId,objectiveHTML){
  clearStage();
  const wrap=el('div','fadein');
  const sc=el('div','scene');
  sc.id='scene';
  wrap.append(sc);
  stage.append(wrap);
  const top=el('div','scene-top');
  const back=el('button','backbtn',GAME.backLabel);
  back.onclick=()=>{closeModal();renderMap();};
  top.append(back);
  const obj=el('div','objective',objectiveHTML||'');
  obj.id='objective';
  top.append(obj);
  return {sc,top,obj,mount(svg){sc.innerHTML='<div class="scenewrap">'+svg+'</div>';sc.append(top);}};
}
function setObjective(html){const o=document.getElementById('objective');if(o)o.innerHTML=html;}
let HS_BUSY=false;
function refreshNext(){
  const sc=document.getElementById('scene'); if(!sc)return;
  sc.querySelectorAll('.hs.next').forEach(h=>h.classList.remove('next'));
  const nxt=[...sc.querySelectorAll('.hs')].find(h=>!h.classList.contains('done')&&!h.classList.contains('hidden'));
  if(nxt){
    nxt.classList.add('next');
    /* when the scene is a swipeable viewport (small portrait screens), bring the next step into view */
    const sw=sc.querySelector('.scenewrap');
    if(sw&&sw.scrollWidth>sw.clientWidth+8){
      try{
        const r=nxt.getBoundingClientRect(), w=sw.getBoundingClientRect();
        sw.scrollTo({left:sw.scrollLeft+(r.left+r.width/2)-(w.left+w.width/2),behavior:'smooth'});
      }catch(e){}
    }
  }
}
function bindHotspots(sc,handlers){
  sc.querySelectorAll('.hs').forEach(g=>{
    const id=g.dataset.hs;
    const fire=()=>{
      if(!handlers[id]||HS_BUSY)return;
      HS_BUSY=true;
      const r=Promise.resolve(handlers[id](g));
      if(g.classList.contains('q'))r.then(()=>g.classList.add('done'));
      r.finally(()=>{HS_BUSY=false;refreshNext();});
    };
    g.addEventListener('click',fire);
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fire();}});
  });
  setTimeout(refreshNext,0);
}

/* ================= navigation between scenes =================
   A game is an ordered list of scenes unlocked one at a time. The host supplies
   ROOM_ORDER (ids in order), ROOM_NAMES (id -> label) and ROOM_FNS (id -> the
   function that renders that scene), plus GAME.wherePrefix and GAME.backLabel.
   The map/line drawing itself belongs to the game; this is the bookkeeping.
*/
function unlockedCount(){
  let n=1;
  for(const id of ROOM_ORDER){if(S.done[id])n=Math.max(n,ROOM_ORDER.indexOf(id)+2);}
  return Math.min(n,ROOM_ORDER.length);
}
function isLastDone(){return !!S.done[ROOM_ORDER[ROOM_ORDER.length-1]];}
function enterRoom(id){
  setWhere(GAME.wherePrefix+ROOM_NAMES[id]);
  ROOM_FNS[id]();
}
function completeRoom(id){
  if(S.progress&&S.progress[id])delete S.progress[id];
  if(!S.done[id]){S.done[id]=true;save();}
}
/* the big button that takes a finished scene back to the map/line */
function doorOut(sc,label){
  const prev=sc.querySelector(':scope > .cta.big'); if(prev)prev.remove();
  const b=el('button','cta big',label||GAME.backLabel.replace('← ','Back to the ')+' →');
  b.style.cssText='position:absolute;left:50%;transform:translateX(-50%);bottom:16px;z-index:5';
  b.onclick=()=>renderMap();
  sc.append(b);
}
/* ================= shell: HUD wiring, theme, restart, phone tip =================
   Everything in the top bar that is the same in every game on the kit. The host
   supplies GAME.themeKey / GAME.tipKey and the restart copy, and calls
   bootShell() after its own chunks have defined renderMap()/titleScreen().
*/
function restartGame(){
  S=freshState();
  save();ledgerFromState();renderChips();setAudit();
  if(typeof onRestart==='function')onRestart();
  closeModal();renderMap();
}
function bootShell(){
  document.getElementById('dirBtn').onclick=()=>showDirectory();
  document.getElementById('audit').onclick=()=>showAudit();
  document.getElementById('audit').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showAudit();}};
  document.getElementById('quizBtn').onclick=()=>showQuizLib();
  document.getElementById('restartBtn').onclick=()=>{
    const card=el('div','mcard');
    card.append(el('div','qk','Restart'));
    card.append(el('h4','','Start the game over?'));
    card.insertAdjacentHTML('beforeend','<p>'+GAME.restartCopy+'</p>');
    const f=el('div','mfoot');f.style.gap='10px';
    const c=el('button','cta ghost','Cancel');c.onclick=closeModal;
    const r=el('button','cta big','Restart');r.onclick=restartGame;
    f.append(c,r);card.append(f);
    openModal(card,true);
  };
  /* light is the default: these games are read in offices, on projectors */
  let THEME=lsGet(GAME.themeKey)||'light';
  applyTheme(THEME);
  document.getElementById('themeBtn').onclick=()=>{
    THEME=THEME==='light'?'dark':'light';
    lsSet(GAME.themeKey,THEME);
    applyTheme(THEME);
  };
  /* one-time phone tip: how to move through wide scenes on a small screen */
  const mtip=document.getElementById('mobiletip');
  if(mtip){
    if(matchMedia('(max-width:740px)').matches&&!lsGet(GAME.tipKey))mtip.style.display='flex';
    mtip.querySelector('button').onclick=()=>{mtip.style.display='none';lsSet(GAME.tipKey,'1');};
  }
  setAudit();renderChips();
}
function applyTheme(t){
  if(t==='light')document.documentElement.dataset.theme='light';
  else delete document.documentElement.dataset.theme;
  document.getElementById('themeBtn').textContent=t==='light'?'☾ dark':'☀ light';
}

function titleScreen(){
  setWhere('Learning Variable Fee Assurance in Mutual & Torres Assurance House');clearStage();renderChips();
  const h=el('div','hero fadein');
  h.append(el('div','kicker','An IFRS 17 adventure'));
  h.append(el('h1','','Walk into the house.<br>Play the <em>variable fee</em>.'));
  h.append(el('p','','Six rooms, one contract, one policyholder who reads her statements. Explore the house, open what glows, answer what the rooms ask, the ledger in the header only moves when you book the economics correctly.'));
  const btns=el('div','btns');
  const done=Object.keys(S.done).length;
  const finished=!!(S.done.storm&&S.capstoneDone);
  /* a finished run greets you with a clean slate: books closed, nothing in the header */
  if(finished){document.getElementById('ledgerchips').innerHTML='';}
  const b=el('button','cta big', finished?'Walk in again':(done?'Continue: '+ROOM_NAMES[ROOM_ORDER[Math.min(done,5)]]:'Enter the house →'));
  b.onclick=()=>{ if(finished){S={done:{},score:0,started:true,progress:{},mistakes:[]};ledgerFromState();renderChips();setAudit();}
    S.started=true;save();renderMap(); };
  btns.append(b);
  if(finished){
    const r=el('button','cta ghost','Revisit the finished house');
    r.onclick=()=>{S.started=true;save();renderChips();renderMap();};
    btns.append(r);
  } else if(done){const r=el('button','cta ghost','Start over');
    r.onclick=()=>{S={done:{},score:0,started:true,progress:{},mistakes:[]};ledgerFromState();renderChips();setAudit();save();renderMap();};btns.append(r);}
  h.append(btns);
  if(finished)h.append(el('p','fy','Your last engagement closed at case mastery '+S.score+'/100'+(S.score>=100?', the case mastered':'')+'. Walking in again opens a fresh set of books; revisiting keeps the old ones open.'));
  stage.append(h);
}

let WALKING=false;
async function walkTo(id,sc){
  const av=sc.querySelector('#avatar'), car=sc.querySelector('#car');
  const from=MAP_POS[avatarAt], to=MAP_POS[id];
  avatarAt=id;
  const fg=av?av.querySelector('.fig'):null;
  if(fg)fg.dataset.state='walk';
  if(RM||!av||document.hidden){if(fg)fg.dataset.state='idle';return;}
  const speed=0.32; // px per ms
  const y1=from.y-84, y2=to.y-84;
  const seq=[];
  if(from.floor!==to.floor){
    seq.push({x:500,y:y1});          // walk to lift
    seq.push({x:500,y:y2});          // ride
    seq.push({x:to.x,y:y2});         // walk to door
  } else seq.push({x:to.x,y:y1});
  let cur={x:from.x,y:y1};
  for(const p of seq){
    const dist=Math.hypot(p.x-cur.x,p.y-cur.y);
    const dur=Math.max(180,dist/speed);
    const anim=av.animate([{transform:`translate(${cur.x}px,${cur.y}px)`},{transform:`translate(${p.x}px,${p.y}px)`}],{duration:dur,easing:'linear',fill:'forwards'});
    if(car&&p.x===500&&cur.x===500){ car.animate([{transform:`translate(0px,${cur.y-8}px)`},{transform:`translate(0px,${p.y-8}px)`}],{duration:dur,easing:'linear',fill:'forwards'});
      setTimeout(()=>car.setAttribute('transform',`translate(0,${p.y-8})`),dur);
    }
    await Promise.race([anim.finished.catch(()=>{}), new Promise(r=>setTimeout(r,dur+400))]);
    cur=p;
  }
  if(fg)fg.dataset.state='idle';
  await new Promise(r=>setTimeout(r,120));
}

       <p><strong>2 · The loss component is a memo of that loss.</strong> It sits inside the liability for remaining coverage. It records how much future service the booked loss has already paid for. It is not an extra provision.</p>
       <p><strong>3 · Good news reverses it first.</strong> A favourable future-service change reduces the loss component before it rebuilds any CSM (paragraph 50(b)). The reversal is a credit in P&amp;L.</p>

          {t:'IFIE: it is a market bounce',why:'It changes the entity’s variable fee, CSM-track under VFA (paragraph 45(b)), and LC-track first while one exists (paragraph 50(b)).'}],cite:['50(b)','103(b)']},fresh);
        if(fresh)applyDeltas({lc:-4,pnl:4});

      } else {
        await quiz({kicker:'The presentation trap',q:'While the loss component exists, the period’s allocation of expected claims and expenses attributed to the LC, does it appear in insurance revenue?',options:[
          {t:'No: excluded from revenue, offset by an equal ISE credit: net zero',ok:true,why:'50(a): amounts allocated to the loss component are <strong>excluded from insurance revenue</strong>, with a matching credit in service expenses (paragraph 103(b)), P&L-neutral by construction. The loss already went through P&L the day the contract turned onerous; revenue must not be re-earned on service the LC pre-paid.'},

        step=3;P.step=3;save();g.classList.add('done');

      setObjective('Objective: <b>READ the pinned note</b> to close the engagement');}
    else if(step>0)setObjective('Objective: survive the onerous year <b>'+step+'/3</b>');
    if(P.note)mk('lcnote');
  }
  if(!fresh){setLC(0);sc.querySelector('.rain').style.display='none';doorOut(sc);}
}

/* ================= end ================= */
function endOverlay(){
  /* the engagement does not close on recall alone: the capstone file comes first */
  if(!S.capstoneDone){
    const card=el('div','mcard');
    card.append(el('div','qk','Engagement almost closed · case mastery '+S.score+'/100'));
    card.append(el('div','grade','Last thing: the capstone file.'));
    card.insertAdjacentHTML('beforeend','<p>You made it through six rooms, each testing what you had just learned. For the final challenge, the auditor hands you <strong>two contracts you have not seen before</strong>: one with a substantial guarantee and one with a documented hedge. Make two calls, worth 12 mastery points each, to close the engagement.</p>');
    const f=el('div','mfoot');
    const later=el('button','cta ghost','Back to the house');later.onclick=()=>{closeModal();renderMap();};
    const go=el('button','cta big','Open the capstone file');go.onclick=()=>{closeModal();runCapstones();};
    f.append(later,go);card.append(f);
    openModal(card,true);save();return;
  }
  const card=el('div','mcard');
  const grade=S.score>=100?'Full marks. The case is mastered.':S.score>=85?'A strong file, a few findings still open.':S.score>=60?'The shape is there; the audit file shows where to look.':'An honest first pass. The retake desk is open.';
  card.append(el('div','qk','Engagement closed · case mastery '+S.score+'/100'));
  card.append(el('div','grade',grade));
  card.append(el('p','','You classified under B101, priced the variable fee under B104, booked a year of economics through paragraph 45, released by coverage units under B119A, survived an onerous cycle under paragraph 47–52, and made two calls the rooms never rehearsed. The house stays open, every room can be revisited with nothing at stake, and the ⓘ board on the map indexes every paragraph.'));
  const rules=el('div','rules');
  rules.innerHTML=['B101(a)–(c)','B102','B107–B108','B109','B104','38','85','B111','45(b)/B112','45(c)/B113(a)','B113(b)','B115–B118','45(e)/B119/B119A','81','47–48','50–52','103(b)'].map(citeChip).join('');
  card.append(rules);
  const R=(!S.drillDue)?retakeList():[];
  if(R.length)card.insertAdjacentHTML('beforeend','<p class="fy">The auditor offers a retake: answer the '+R.length+' question'+(R.length>1?'s':'')+' you missed, all right in one sitting, then walk through the numbers drill, and the mastery those findings carry, '+R.reduce((t,r)=>t+(r.p||QUESTION_PTS),0)+' points, is earned back.</p>');
  if(S.drillDue)card.insertAdjacentHTML('beforeend','<p class="fy">Your retake is cleared. One step left: finish the numbers drill, nothing at stake, and the mastery your findings carried comes back.</p>');
  if(S.score>=100)card.insertAdjacentHTML('beforeend','<p class="fy">Before you go: click any number in the top bar, Pool, RA, CSM or P&amp;L, to see its whole story as a roll-forward and waterfall.</p>');
  const f=el('div','mfoot');
  const again=el('button','cta ghost','Play again');
  again.onclick=()=>{S={done:{},score:0,started:true,progress:{},mistakes:[]};ledgerFromState();renderChips();setAudit();save();closeModal();renderMap();};
  const map=el('button','cta'+(R.length?'':' big'),'Back to the house');
  map.onclick=()=>{closeModal();renderMap();};
  f.append(again,map);
  if(R.length){const rt=el('button','cta big','Retake what you missed');rt.onclick=()=>{closeModal();runRetake(R);};f.append(rt);}
  if(S.drillDue){const dd=el('button','cta big','Finish the numbers drill');dd.onclick=()=>{closeModal();runDrill();};f.append(dd);}
  card.append(f);
  openModal(card,true);
  save();
}
/* ================= boot ================= */
const ROOM_FNS={lobby:roomLobby,underwriting:roomUnderwriting,studio:roomStudio,
                market:roomMarket,release:roomRelease,storm:roomStorm};
function onRestart(){avatarAt='lobby';}
bootShell();
/* a run is only finished once the capstone file is closed too */
if(S.started&&Object.keys(S.done).length>0&&!(S.done.storm&&S.capstoneDone)){renderMap();}
else titleScreen();
</script>
